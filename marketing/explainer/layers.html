<!doctype html><meta charset="utf-8"><body style="margin:0;background:#16202E">
<script src="../the-note/portrait.js"></script>
<script src="../the-note/note.js"></script>
<script>
// The Note, taken apart. Every element of the flat 3264x1400 master drawn on its own transparent
// canvas at the master's coordinates, so a video can move them independently and reassemble the
// note pixel-for-pixel (paper, then the rest in any order). Plus the extra pieces the explainer
// needs: a seal with its rim lettering, an engraved IMD coin, caption plates, and the geometry.
const lines = {};
const layer = (name, draw) => { const cv = mk(NW, NH), c = cv.getContext("2d"); draw(c); lines[name] = cv; return cv; };
const IN = 172, B = 62, BT = 92, cw = 330, ch = 250;
const CORNERS = [[IN, IN - 6], [NW - IN - cw, IN - 6], [IN, NH - IN - ch + 6], [NW - IN - cw, NH - IN - ch + 6]];
const SERIALS = [[560, NH - IN - 70, 700, 76], [NW - 560 - 700, NH - IN - 70, 700, 76]];
const oval = drawOval();
const osc = 924 / OH, ow = OW * osc, ox = NW / 2 - ow / 2, oy = 302;

// 1. paper: ivory, fibre texture, the faint wave field, the outer edge line
layer("paper", (c) => {
  c.fillStyle = PAL.ivory; c.fillRect(0, 0, NW, NH);
  paperTexture(c);
  waveField(c, IN, IN, NW - IN, NH - IN);
  c.strokeStyle = PAL.hair; c.lineWidth = 4; c.strokeRect(2, 2, NW - 4, NH - 4);
});
// 2. border: rules + the four lathe bands
layer("border", (c) => {
  c.strokeStyle = PAL.ink; c.lineWidth = 7; c.strokeRect(34, 34, NW - 68, NH - 68);
  c.lineWidth = 2; c.strokeRect(50, 50, NW - 100, NH - 100);
  lathe(c, B, B, NW - 2 * B, BT, false); lathe(c, B, NH - B - BT, NW - 2 * B, BT, false);
  lathe(c, B, B, BT, NH - 2 * B, true); lathe(c, NW - B - BT, B, BT, NH - 2 * B, true);
  c.strokeStyle = PAL.ink; c.lineWidth = 4; c.strokeRect(B, B, NW - 2 * B, NH - 2 * B);
  c.strokeRect(B + BT, B + BT, NW - 2 * (B + BT), NH - 2 * (B + BT));
  c.strokeStyle = PAL.hair; c.lineWidth = 3; c.strokeRect(B + BT + 8, B + BT + 8, NW - 2 * (B + BT + 8), NH - 2 * (B + BT + 8));
});
// 3. rosette (the oracle panel in the explainer)
const ROSETTE = { cx: 724, cy: 700, R: 320 };
const ROSETTE_RINGS = [
  { col: PAL.green, lw: 1.4, inner: 0.52, outer: 0.98, lobes: 12, copies: 16, loop: 0.03 },
  { col: PAL.ink, alpha: 0.7, lw: 0.9, inner: 0.22, outer: 0.5, lobes: 9, copies: 14, loop: 0.02 },
  { col: PAL.green, lw: 1, inner: 0.02, outer: 0.2, lobes: 6, copies: 10, loop: 0 },
];
layer("rosette", (c) => lace(c, ROSETTE.cx, ROSETTE.cy, ROSETTE.R, ROSETTE_RINGS));
// 4. portrait oval at its place on the note (the vault)
layer("portrait", (c) => c.drawImage(oval, ox, oy, ow, 924));
// 5. seal with the mark (redemption)
const SEAL = { cx: 2540, cy: 700, R: 280 };
layer("seal", (c) => { seal(c, SEAL.cx, SEAL.cy, SEAL.R); pixelMark(c, SEAL.cx, SEAL.cy, 192, PAL.oxblood); });
// 6. corners: four cartouches with the denomination (the peg)
layer("corners", (c) => {
  for (const [x, y] of CORNERS) emptyFrame(c, x, y, cw, ch, 44, 28);
  c.save(); c.textBaseline = "middle"; c.textAlign = "center"; c.fillStyle = PAL.ink; c.font = `700 150px ${MONO}`;
  for (const [x, y] of CORNERS) c.fillText("1", x + cw / 2, y + ch / 2 + 8);
  c.restore();
});
// 7. banner with the lockup
layer("banner", (c) => {
  emptyFrame(c, 560, IN - 6, NW - 1120, 126, 30, 20);
  c.save(); c.fillStyle = PAL.ink;
  const bannerY = IN - 6, bannerH = 126, by = bannerY + bannerH / 2, bx = NW / 2, size = 74;
  c.textBaseline = "alphabetic";
  c.font = `400 ${size}px ${MONO}`; const m1 = c.measureText("imd"), w1 = m1.width;
  c.font = `700 ${size}px ${MONO}`; const m2 = c.measureText("USD"), w2 = m2.width;
  const asc = Math.max(m1.actualBoundingBoxAscent, m2.actualBoundingBoxAscent);
  const desc = Math.max(m1.actualBoundingBoxDescent, m2.actualBoundingBoxDescent);
  const base = by + (asc - desc) / 2, x0 = bx - (w1 + w2) / 2;
  c.font = `400 ${size}px ${MONO}`; c.textAlign = "left"; c.fillText("imd", x0, base);
  c.font = `700 ${size}px ${MONO}`; c.fillText("USD", x0 + w1, base);
  c.restore();
});
// 8. serial strips (the ledger)
layer("serials", (c) => {
  for (const [x, y, w, h] of SERIALS) emptyFrame(c, x, y, w, h, 22, 14);
  c.save(); c.textBaseline = "middle"; c.textAlign = "center"; c.fillStyle = PAL.green; c.font = `700 44px ${MONO}`;
  for (const x of [560 + 350, NW - 560 - 350]) c.fillText("IMD 00000001 A", x, NH - IN - 70 + 38 + 2);
  c.restore();
});
// 8b. the serial strips' frames alone, so the video can type its own serial / log text into them
layer("serials-empty", (c) => { for (const [x, y, w, h] of SERIALS) emptyFrame(c, x, y, w, h, 22, 14); });

// Checks: the layers stacked must equal the master. Both are emitted so the renderer can compare.
const stacked = mk(NW, NH), sc = stacked.getContext("2d");
for (const n of ["paper", "border", "rosette", "portrait", "seal", "corners", "banner", "serials"]) sc.drawImage(lines[n], 0, 0);
const master = drawNote(oval); // not emitted: it is marketing/kit/plates/note-master.png
// pixel check: count pixels where the stack differs from the master by more than 2/255 in any channel
const CHECK = (() => {
  const a = sc.getImageData(0, 0, NW, NH).data, b = master.getContext("2d").getImageData(0, 0, NW, NH).data;
  let bad = 0, maxd = 0;
  for (let i = 0; i < a.length; i += 4) { const d = Math.max(Math.abs(a[i] - b[i]), Math.abs(a[i + 1] - b[i + 1]), Math.abs(a[i + 2] - b[i + 2])); if (d > 2) bad++; if (d > maxd) maxd = d; }
  return { differingPixels: bad, totalPixels: a.length / 4, maxChannelDelta: maxd };
})();

// ---- extra pieces ----------------------------------------------------------------------------
// The seal as a stamp, with its rim lettering, on a transparent 1000x1000 canvas. Beat 3.
{
  const S = 1000, cv = mk(S, S), c = cv.getContext("2d"), cx = S / 2, cy = S / 2, R = 280;
  seal(c, cx, cy, R); pixelMark(c, cx, cy, 192, PAL.oxblood);
  c.strokeStyle = PAL.oxblood; c.lineWidth = 3; c.beginPath(); c.arc(cx, cy, R + 36, 0, 7); c.stroke();
  c.lineWidth = 6; c.beginPath(); c.arc(cx, cy, R + 128, 0, 7); c.stroke();
  c.lineWidth = 2; c.beginPath(); c.arc(cx, cy, R + 138, 0, 7); c.stroke();
  // text on the arc between the two rings, reading clockwise over the top and (mirrored) under the bottom
  const arcText = (txt, r, a0, a1, flip) => {
    c.save(); c.fillStyle = PAL.oxblood; c.font = `700 52px ${MONO}`; c.textAlign = "center"; c.textBaseline = "middle";
    // over the top the glyphs run clockwise with their feet toward the centre; under the bottom they run
    // anticlockwise with their feet outward, so both lines read left to right and upright
    const n = txt.length, span = a1 - a0;
    for (let i = 0; i < n; i++) {
      const a = flip ? a1 - (span * (i + 0.5)) / n : a0 + (span * (i + 0.5)) / n;
      c.save(); c.translate(cx + r * Math.cos(a), cy + r * Math.sin(a)); c.rotate(a + (flip ? -Math.PI / 2 : Math.PI / 2)); c.fillText(txt[i], 0, 0); c.restore();
    }
    c.restore();
  };
  const r = R + 82;
  arcText("REDEEMABLE FOR ONE DOLLAR OF IMD", r, Math.PI * 1.12, Math.PI * 1.88, false);
  arcText("BACKED BY THE SWARM", r, Math.PI * 0.22, Math.PI * 0.78, true);
  for (const a of [Math.PI * 0.08, Math.PI * 0.92]) { c.fillStyle = PAL.oxblood; c.beginPath(); c.arc(cx + r * Math.cos(a), cy + r * Math.sin(a), 7, 0, 7); c.fill(); }
  lines["seal-stamp"] = cv;
}
// An engraved IMD coin and an sIMD coin, transparent 800x800. Beat 1.
const coin = (label) => {
  const S = 800, cv = mk(S, S), c = cv.getContext("2d"), cx = S / 2, cy = S / 2, R = 360;
  c.fillStyle = PAL.ivory; c.beginPath(); c.arc(cx, cy, R + 10, 0, 7); c.fill();
  lace(c, cx, cy, R, [
    { col: PAL.green, lw: 1.3, inner: 0.62, outer: 0.98, lobes: 16, copies: 12, loop: 0.02 },
    { col: PAL.ink, alpha: 0.6, lw: 0.9, inner: 0.5, outer: 0.62, lobes: 24, copies: 8, loop: 0 },
  ]);
  c.fillStyle = PAL.ivory; c.beginPath(); c.arc(cx, cy, R * 0.47, 0, 7); c.fill();
  c.strokeStyle = PAL.ink; c.lineWidth = 5; c.beginPath(); c.arc(cx, cy, R * 0.47, 0, 7); c.stroke();
  c.lineWidth = 1.5; c.beginPath(); c.arc(cx, cy, R * 0.43, 0, 7); c.stroke();
  // reeded edge
  c.strokeStyle = PAL.ink; c.lineWidth = 2;
  for (let i = 0; i < 180; i++) { const a = (i / 180) * Math.PI * 2; c.beginPath(); c.moveTo(cx + (R + 2) * Math.cos(a), cy + (R + 2) * Math.sin(a)); c.lineTo(cx + (R + 10) * Math.cos(a), cy + (R + 10) * Math.sin(a)); c.stroke(); }
  c.fillStyle = PAL.ink; c.textAlign = "center"; c.textBaseline = "middle"; c.font = `700 ${label.length > 3 ? 96 : 120}px ${MONO}`;
  c.fillText(label, cx, cy + 6);
  return cv;
};
lines["coin-imd"] = coin("IMD");
lines["coin-simd"] = coin("sIMD");

// Caption plates: 1920 wide, transparent, two inks (ivory for over the ink ground, ink for over paper).
// One file per caption per ink. The video overlays them; nothing else letters anything.
const CAPTIONS = {
  "a1": "Deposit IMD. It is staked as sIMD.",
  "a1b": "Borrow imdUSD against it.",
  "a2": "The price is a question.\nA panel of agents answers it.",
  "a3": "Every note redeems for $1 of IMD.",
  "a4": "Fall below the credit line\nand you risk liquidation.",
  "a5": "Priced by agents. Backed by IMD.",
  "a5-alt": "The swarm's dollar.",
  "b1": "Who decides what a dollar is worth?",
  "b2": "Here, a panel of agents answers\none fixed question.",
  "b3": "The answer is signed.\nAnyone may request it.",
  "b4": "Every note redeems for $1 of IMD.",
  "url": "imdusd.com",
};
const caption = (txt, col) => {
  const W = 1920, size = 72, lh = size * 1.3, rows = txt.split("\n"), H = Math.round(lh * rows.length + 60);
  const cv = mk(W, H), c = cv.getContext("2d");
  c.fillStyle = col; c.textAlign = "center"; c.textBaseline = "middle"; c.font = `500 ${size}px ${MONO}`;
  rows.forEach((r, i) => c.fillText(r, W / 2, 30 + lh * (i + 0.5)));
  return cv;
};
for (const [k, txt] of Object.entries(CAPTIONS)) {
  lines[`caption-${k}-ivory`] = caption(txt, PAL.ivory);
  lines[`caption-${k}-ink`] = caption(txt, PAL.ink);
}

// Geometry, so a storyboard can place and move things without re-deriving them from note.js.
const GEOM = {
  master: { w: NW, h: NH }, inset: IN,
  paperField: { x: IN, y: IN, w: NW - 2 * IN, h: NH - 2 * IN },
  borderBands: { inset: B, thickness: BT },
  rosette: ROSETTE,
  portrait: { x: ox, y: oy, w: ow, h: 924, sourceCanvas: { w: OW, h: OH }, innerEllipse: { cx: ox + OCX * osc, cy: oy + OCY * osc, rx: IRX * osc, ry: IRY * osc }, scale: osc },
  seal: SEAL,
  banner: { x: 560, y: IN - 6, w: NW - 1120, h: 126 },
  corners: CORNERS.map(([x, y]) => ({ x, y, w: cw, h: ch })),
  serials: SERIALS.map(([x, y, w, h]) => ({ x, y, w, h })),
  sealStamp: { canvas: 1000, cx: 500, cy: 500, R: 280, rimRadius: 280 + 82 },
  coin: { canvas: 800, cx: 400, cy: 400, R: 360 },
  captions: Object.fromEntries(Object.entries(CAPTIONS).map(([k, t]) => [k, { text: t, w: 1920, h: lines[`caption-${k}-ink`].height, font: "500 72px mono", lineHeight: 93.6 }])),
  palette: PAL,
  stackOrder: ["paper", "border", "rosette", "portrait", "seal", "corners", "banner", "serials"],
  stackEqualsMaster: CHECK,
};
const pre = document.createElement("pre"); pre.id = "out";
pre.textContent = Object.entries(lines).map(([n, c]) => n + "\t" + c.toDataURL("image/png").split(",")[1]).join("\n") + "\ngeometry.json\t" + btoa(JSON.stringify(GEOM, null, 2));
document.body.appendChild(pre);
</script>
