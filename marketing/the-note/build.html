<!doctype html><meta charset="utf-8"><body style="margin:0;background:#16202E">
<script src="portrait.js"></script>
<script src="note.js"></script>
<script>
const oval = drawOval();
const note = drawNote(oval);
const det = mk(2048, 2048), dc = det.getContext("2d");
dc.fillStyle = PAL.ink; dc.fillRect(0, 0, 2048, 2048); dc.drawImage(oval, 204, 24);
const f169 = flat(note, 1920, 1080, 0.85), f11 = flat(note, 1080, 1080, 0.88);
const a169 = angled(note, 1920, 1080, 0.80), a11 = angled(note, 1080, 1080, 0.90);
const sh = sheet([f169, f11, a169, a11, det]);
const lines = { "note-master": note, "note-front-16x9": f169, "note-front-1x1": f11, "note-angle-16x9": a169, "note-angle-1x1": a11, "portrait-detail": det, sheet: sh };
// Blink frames for the video (storyboard section 5c): the portrait-detail canvas, eyes at openness
// 0.75 / 0.5 / 0.25 / 0. Same 2048 canvas and inlay position as portrait-detail, so they drop into the
// storyboard's composite at the same coordinates. Openness 1 is portrait-detail itself.
for (const o of [75, 50, 25, 0]) {
  setEyes(o / 100);
  const b = mk(2048, 2048), bc = b.getContext("2d");
  bc.fillStyle = PAL.ink; bc.fillRect(0, 0, 2048, 2048); bc.drawImage(drawOval(), 204, 24);
  lines[`blink-${String(o).padStart(3, "0")}`] = b;
}
// Eye contact: the same portrait with the pupils on the viewer, open and at each blink stage, so the
// video can close the eyes looking away and reopen them looking at you.
setLook(1);
for (const o of [100, 75, 50, 25]) {
  setEyes(o / 100);
  const b = mk(2048, 2048), bc = b.getContext("2d");
  bc.fillStyle = PAL.ink; bc.fillRect(0, 0, 2048, 2048); bc.drawImage(drawOval(), 204, 24);
  lines[o === 100 ? "portrait-look" : `blink-look-${String(o).padStart(3, "0")}`] = b;
}
setLook(0);
setEyes(1);
const pre = document.createElement("pre"); pre.id = "out";
pre.textContent = Object.entries(lines).map(([n, c]) => n + "\t" + c.toDataURL("image/png").split(",")[1]).join("\n");
document.body.appendChild(pre);
</script>
