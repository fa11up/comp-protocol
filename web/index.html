<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="" />
    <script>
      // Resolve before the first paint; colors themselves stay in the CSS tokens.
      (() => {
        let saved;
        try {
          saved = localStorage.getItem("comp-terminal-theme");
        } catch {}
        document.documentElement.dataset.theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      })();
    </script>
    <meta
      name="description"
      content="COMP compute-backed stablecoin terminal. Positions, redemption, work rights and protocol state on Sepolia."
    />
    <title>COMP / Terminal</title>
    <link rel="icon" href="./favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
